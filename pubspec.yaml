name: pearant_app
description: "Bilingual (Arabic/English) Flutter companion app for Al-Faseelah World — an AI-powered educational toy for children aged 4-9."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  flutter_blue_plus: ^1.31.15
  google_fonts: ^6.3.2
  shared_preferences: ^2.2.2
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
